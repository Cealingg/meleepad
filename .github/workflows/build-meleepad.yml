name: Build MeleePad Brut via URL Texte (Sans Compte Apple)

on:
  workflow_dispatch: # Permet de lancer manuellement le build d'un clic depuis l'iPad

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Récupération du code source complet
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Indispensable pour télécharger les sous-modules Recomp/Slippi du projet

      - name: 2. Configuration des outils requis (CMake & Ninja)
        run: |
          echo "Installation des outils nécessaires à la recompilation..."
          brew install cmake ninja ripgrep

      - name: 3. Configuration de la version de Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: 4. Téléchargement de l'ISO de Melee depuis jeu.txt
        run: |
          FILE_PATH=".github/jeu.txt"
          
          if [ -f "$FILE_PATH" ]; then
            # Récupère l'URL brute du jeu présente dans le fichier texte
            ISO_URL=$(cat "$FILE_PATH" | xargs)
            echo "URL détectée : $ISO_URL"
            
            echo "Téléchargement de l'ISO de Melee en cours..."
            curl -L "$ISO_URL" -o melee.iso
          else
            echo "❌ Erreur : Le fichier .github/jeu.txt est introuvable."
            exit 1
          fi

          if [ -f "melee.iso" ]; then
            echo "Fichier ISO téléchargé avec succès."
          else
            echo "❌ Erreur : Le téléchargement a échoué ou le fichier 'melee.iso' est introuvable."
            exit 1
          fi

      - name: 5. Préparation et conversion native du jeu
        run: |
          # Utilisation des scripts officiels de MeleePad pour injecter et compiler le code de l'ISO
          ./scripts/bootstrap-dependencies.sh
          ./scripts/prepare-game.sh ./melee.iso

      - name: 6. Compilation du projet brut (Sans signature Apple)
        run: |
          # Ces options forcent Xcode à sauter l'étape de vérification des certificats
          xcodebuild build \
            -project MeleePad.xcodeproj \
            -scheme MeleePad \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 7. Préparation du package d'application pour ESign
        run: |
          # Récupération automatique du dossier MeleePad.app créé par Xcode
          BUILD_DIR=$(xcodebuild -project MeleePad.xcodeproj -scheme MeleePad -configuration Release -sdk iphoneos -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
          echo "Dossier de build trouvé : $BUILD_DIR"
          
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$BUILD_DIR/MeleePad.app" $RUNNER_TEMP/Payload/
          
          # Compression au format ZIP (prêt à être importé dans ESign)
          cd $RUNNER_TEMP
          zip -r MeleePad-Unsigned.zip Payload

      - name: 8. Publication du package (Téléchargement sur l'iPad)
        uses: actions/upload-artifact@v4
        with:
          name: MeleePad-iPadOS-Brut
          path: ${{ runner.temp }}/MeleePad-Unsigned.zip
